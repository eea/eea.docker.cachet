server {
    listen 8000 default_server;

    server_name _;
    root /var/www/html/public;

    index index.php;

    charset utf-8;

    error_page 400 /error/outoforder.html;
    error_page 403 /error/outoforder.html;
    error_page 405 /error/outoforder.html;
    error_page 429 /error/outoforder.html;
    error_page 500 /error/outoforder.html;

    error_page 408 /error/outoforder.html;
    error_page 425 /error/outoforder.html;
    error_page 502 /error/outoforder.html;
    error_page 504 /error/outoforder.html;

    error_page 503 /error/maintenance.html;

    location /error/ {

       if ($arg_code = "400") {
           return 400;
       }
       if ($arg_code = "403") {
           return 403;
       }
       if ($arg_code = "405") {
           return 405;
       }
       if ($arg_code = "429") {
           return 429;
       }
       if ($arg_code = "500") {
           return 500;
       }
       if ($arg_code = "408") {
           return 408;
       }
       if ($arg_code = "425") {
           return 425;
       }
       if ($arg_code = "502") {
           return 502;
       }
       if ($arg_code = "504") {
           return 504;
       }
       if ($arg_code = "503") {
           return 503;
       }
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Cache static assets
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|ttf|woff2?|svg|webp)$ {
        expires 365d;
        try_files $uri /index.php?$query_string;
    }

    # Public status pages render the same for every anonymous visitor but cost
    # ~0.3s of CPU each, so share a 10s cached copy (one render at a time, the
    # stale copy is served while it refreshes). They hold no forms or CSRF
    # token, and the cached copy never carries the session cookie.
    location ~ ^/(|badge\.svg|rss|slack\.rss|incidents/[^/]+|schedules/[^/]+|components/[0-9]+/badge\.svg)$ {
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_read_timeout 180s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;

        fastcgi_cache statuspage;
        # behind the ingress $scheme is always http: key on the forwarded protocol too
        fastcgi_cache_key "$scheme$http_x_forwarded_proto$host$request_uri";
        fastcgi_cache_valid 200 10s;
        fastcgi_cache_lock on;
        fastcgi_cache_use_stale updating error timeout http_500 http_503;
        fastcgi_cache_background_update on;
        fastcgi_cache_bypass $statuspage_skip_cache;
        fastcgi_no_cache $statuspage_skip_cache;
        fastcgi_ignore_headers Cache-Control Expires Set-Cookie;
        fastcgi_hide_header Set-Cookie;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_index index.php;
        fastcgi_keep_conn on;
        fastcgi_read_timeout 180s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
