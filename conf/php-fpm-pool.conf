[global]
daemonize = no
error_log = /proc/self/fd/2
pid = /tmp/php-fpm.pid

[www]
listen = 127.0.0.1:9000

; values come from the environment (defaults are exported by entrypoint.sh)
pm = ondemand
pm.max_children = ${PHP_MAX_CHILDREN}
pm.process_idle_timeout = 10s
pm.max_requests = 500
request_terminate_timeout = ${TIMEOUT}

; pass the container environment (DB_*, APP_*, MAIL_*, ...) to Laravel
clear_env = no

catch_workers_output = yes
decorate_workers_output = no
access.log = /proc/self/fd/2

php_admin_value[max_execution_time] = ${PHP_MAX_EXECUTION_TIME}
; Cachet does not use upload progress; recommended off by GHSA-6wmf-4rv5-p3rp
php_admin_flag[session.upload_progress.enabled] = off
