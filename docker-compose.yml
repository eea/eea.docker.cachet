services:
  postgres:
    image: eeacms/postgres:17s
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DBNAME=cachet
      - POSTGRES_DBUSER=cachet
      - POSTGRES_DBPASS=cachet
      - POSTGRES_PASSWORD=postgres
    restart: always
  cachet:
    build:
      context: .
    ports:
      - 8000:8000
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=cachet
      - DB_USERNAME=cachet
      - DB_PASSWORD=cachet
      - DB_PREFIX=chq_
      - APP_KEY=${APP_KEY:?set APP_KEY, see README}
      - APP_URL=http://localhost:8000
    volumes:
      - cachet-uploads:/var/www/html/storage/app/public
    depends_on:
      - postgres
    restart: on-failure

volumes:
  postgres-data:
  cachet-uploads:
